name: Windows package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/lib/windows/requirements.txt
      - name: Install Windows build dependencies
        run: python -m pip install -r packages/lib/windows/requirements.txt
      - name: Test native collectors and desktop adapter
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: packages/lib/src
        run: python -m unittest discover -s packages/lib/tests -v
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build portable package and installer
        shell: pwsh
        run: ./packages/lib/windows/build.ps1
      - name: Test packaged CLI and collectors without credentials
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ai-status-clean-profile"
          New-Item -ItemType Directory -Force $root | Out-Null
          $env:USERPROFILE = $root
          $env:HOME = $root
          $env:APPDATA = Join-Path $root "Roaming"
          $env:LOCALAPPDATA = Join-Path $root "Local"
          $env:CODEX_HOME = Join-Path $root "codex"
          $env:CLAUDE_CONFIG_DIR = Join-Path $root "claude"
          $env:XDG_DATA_HOME = Join-Path $root "data"
          $env:XDG_CONFIG_HOME = Join-Path $root "config"
          $env:COMMANDCODE_API_KEY = ""
          $env:QT_QPA_PLATFORM = "offscreen"
          python packages/lib/tests/packaged_smoke.py dist/ai-status/ai-status-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI smoke test failed" }
          $version = (Get-Content packages/lib/VERSION -Raw).Trim()
          $installer = Join-Path $PWD "dist/ai-status-$version-windows-x64-setup.exe"
          $installed = Join-Path $env:RUNNER_TEMP "AI Status installed"
          $result = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Silent installation failed" }
          python packages/lib/tests/packaged_smoke.py "$installed/ai-status-cli.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI smoke test failed" }
          $result = Start-Process -FilePath "$installed/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Silent uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error

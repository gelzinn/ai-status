name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # BOT_TOKEN also lets CI run on the generated release PR. PRs created
      # with GITHUB_TOKEN would not trigger pull_request workflows.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build, verify, and publish the pending draft release
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: bash .github/scripts/publish_release.sh

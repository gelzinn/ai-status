name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate PR title and user-facing release notes
        run: python3 .github/scripts/check_pr.py "$GITHUB_EVENT_PATH"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "packages/lib"
          format: tty
          severity: warning

      - name: Lint release publication scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ".github/scripts"
          format: tty
          severity: warning

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Python syntax
        run: |
          python -m py_compile packages/lib/src/core/*.py
          python -m py_compile packages/lib/src/providers/**/*.py
          python -m py_compile packages/lib/src/windows.py
          python -m py_compile packages/lib/install-wizard.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop test dependencies
        run: python -m pip install -r packages/lib/windows/requirements.txt
      - name: Run collector and desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: packages/lib/src
        run: python -m unittest discover -s packages/lib/tests -v

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test stable installs and updates
        run: python3 -m unittest discover -s tests -v

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke-test the installable package
        run: |
          mkdir "$RUNNER_TEMP/release-source"
          git archive HEAD packages/lib packages/shared | tar -x -C "$RUNNER_TEMP/release-source"
          python3 .github/scripts/build_release.py --source "$RUNNER_TEMP/release-source" --output "$RUNNER_TEMP/release-assets" --version "$(cat packages/lib/VERSION)"

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release validation tools
        run: npm install --prefix "$RUNNER_TEMP/release-validation" --no-audit --no-fund release-please@17.3.0 ajv@8.17.1
      - name: Test versioning and release notes without publishing
        run: NODE_PATH="$RUNNER_TEMP/release-validation/node_modules" node tests/test_release_config.cjs

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qttest qt6-qpa-plugins
      - name: Parse QML without rewriting files
        run: |
          for qml in packages/lib/quickshell/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" > /dev/null
          done
      - name: Test native page interactions without a desktop
        run: python3 packages/lib/tests/run_qml_tests.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --ignore-scripts
      - name: Build website
        run: npm run build --workspace @ai-status/web

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      windows-preview:
        description: Build and test the Windows preview package
        type: boolean
        default: true
  workflow_call:
    inputs:
      windows-preview:
        description: Include the Windows preview; releases package their exact tag separately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.changes.outputs.lint }}
      python-syntax: ${{ steps.changes.outputs.python-syntax }}
      python-tests: ${{ steps.changes.outputs.python-tests }}
      installer: ${{ steps.changes.outputs.installer }}
      macos-installer: ${{ steps.changes.outputs.macos-installer }}
      macos-native: ${{ steps.changes.outputs.macos-native }}
      release-package: ${{ steps.changes.outputs.release-package }}
      release-tests: ${{ steps.changes.outputs.release-tests }}
      release-config: ${{ steps.changes.outputs.release-config }}
      qml-syntax: ${{ steps.changes.outputs.qml-syntax }}
      web-build: ${{ steps.changes.outputs.web-build }}
      windows-package: ${{ steps.changes.outputs.windows-package }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test affected-check selection
        run: python3 -m unittest discover -s tests -p 'test_ci_selection.py' -v
      - name: Select checks from changed files
        id: changes
        run: python3 .github/scripts/ci_selection.py "$GITHUB_EVENT_PATH"
      - name: Validate PR title and user-facing release notes
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_pr.py "$GITHUB_EVENT_PATH"

  lint:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "packages/lib"
          format: tty
          severity: warning

      - name: Lint release publication scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ".github/scripts"
          format: tty
          severity: warning

  python-syntax:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.python-syntax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Python syntax
        run: python3 -m compileall -q packages/lib .github/scripts tests

  python-tests:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.python-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop test dependencies
        run: python -m pip install -r packages/lib/windows/requirements.txt
      - name: Run collector and desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: packages/lib/src
        run: python -m unittest discover -s packages/lib/tests -v

  installer:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.installer == 'true' || needs.pr-metadata.outputs.macos-installer == 'true' || needs.pr-metadata.outputs.release-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test Linux stable installs and updates
        if: needs.pr-metadata.outputs.installer == 'true'
        run: python3 -m unittest discover -s tests -p 'test_installer.py' -v
      - name: Test macOS stable installs and updates
        if: needs.pr-metadata.outputs.macos-installer == 'true'
        run: python3 -m unittest discover -s tests -p 'test_macos_installer.py' -v
      - name: Test release metadata, archives and publication recovery
        if: needs.pr-metadata.outputs.release-tests == 'true'
        run: python3 -m unittest discover -s tests -p 'test_release_flow.py' -v

  macos-native:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.macos-native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the macOS backend and read-only Keychain adapter
        run: python3 -m unittest discover -s packages/lib/tests -p 'test_macos*.py' -v
      - name: Build and smoke-test the native app without provider requests
        run: |
          AI_STATUS_TEST_HOME="$RUNNER_TEMP/ai-status-macos-home"
          mkdir -p "$AI_STATUS_TEST_HOME"
          HOME="$AI_STATUS_TEST_HOME" bash packages/lib/install-macos.sh --no-start --no-interactive
          HOME="$AI_STATUS_TEST_HOME" "$AI_STATUS_TEST_HOME/Applications/AI Status.app/Contents/MacOS/AIStatus" --check-runtime
          HOME="$AI_STATUS_TEST_HOME" "$AI_STATUS_TEST_HOME/Applications/AI Status.app/Contents/MacOS/AIStatus" --smoke --preview-directory "$RUNNER_TEMP/macos-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-panel-preview
          path: ${{ runner.temp }}/macos-preview/*.png
          if-no-files-found: error

  release-package:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.release-package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke-test the installable package
        run: |
          mkdir "$RUNNER_TEMP/release-source"
          git archive HEAD package.json packages/lib packages/shared | tar -x -C "$RUNNER_TEMP/release-source"
          version=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          python3 .github/scripts/build_release.py --source "$RUNNER_TEMP/release-source" --output "$RUNNER_TEMP/release-assets" --version "$version"

  release-config:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.release-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release validation tools
        run: npm install --prefix "$RUNNER_TEMP/release-validation" --no-audit --no-fund release-please@17.3.0 ajv@8.17.1
      - name: Test versioning and release notes without publishing
        run: NODE_PATH="$RUNNER_TEMP/release-validation/node_modules" node tests/test_release_config.cjs

  qml-syntax:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.qml-syntax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-shapes qml6-module-qtquick-templates qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qttest qt6-qpa-plugins
      - name: Parse QML without rewriting files
        run: |
          for qml in packages/lib/quickshell/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" > /dev/null
          done
      - name: Test native page interactions without a desktop
        run: python3 packages/lib/tests/run_qml_tests.py

  web-build:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.web-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --ignore-scripts
      - name: Build website
        run: npm run build --workspace @ai-status/web

  windows-package:
    needs: pr-metadata
    if: needs.pr-metadata.outputs.windows-package == 'true' && (github.event_name == 'pull_request' || inputs.windows-preview)
    uses: ./.github/workflows/windows.yml

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "packages/lib"
          format: tty
          severity: warning

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Python syntax
        run: |
          python -m py_compile packages/lib/src/core/*.py
          python -m py_compile packages/lib/src/providers/**/*.py
          python -m py_compile packages/lib/install-wizard.py

      - name: Test daemon adapters and isolated installers
        run: python -m unittest discover -s packages/lib/tests -v

  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Parse QML without rewriting files
        run: |
          for qml in packages/lib/quickshell/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" > /dev/null
          done

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --ignore-scripts
      - name: Build website
        run: npm run build --workspace @ai-status/web

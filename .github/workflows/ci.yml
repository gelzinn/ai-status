name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "packages/lib"
          format: tty
          severity: warning

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Python syntax
        run: |
          python -m py_compile packages/lib/src/core/*.py
          python -m py_compile packages/lib/src/providers/**/*.py
          python -m py_compile packages/lib/src/windows.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop test dependencies
        run: python -m pip install -r packages/lib/windows/requirements.txt
      - name: Run collector and desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: packages/lib/src
        run: python -m unittest discover -s packages/lib/tests -v
